<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
        :root {
        --primary-blue: #0a2540;
        --accent-orange: #f97316;
        --accent-gold: #fbbf24;
        --light-bg: #f4f7fb;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                var(--primary-blue),
                #133b63
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Montserrat", sans-serif;
            padding: 20px;
        }

        .login-card {
        width: 100%;
        max-width: 520px;
        background: #fff;
        border-radius: 20px;
        padding: 40px 35px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        border: none;
        }

        .logo-circle {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: white;
        }

        .login-title {
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -0.01em;
        }
        
        .login-subtitle {
            color: #6b7280;
            font-size: 14px;
            letter-spacing: 0.05em;
        }

        .form-control {
        height: 52px;
        border-radius: 12px;
        border: 1px solid #dbe2ea;
        padding-left: 45px;
        transition: 0.3s ease;
        }

        .form-control:focus {
        border-color: var(--accent-orange);
        box-shadow: 0 0 0 0.15rem rgba(249, 115, 22, 0.2);
        }

        .input-group-text {
        position: absolute;
        z-index: 10;
        height: 52px;
        background: transparent;
        border: none;
        color: #6b7280;
        padding-left: 15px;
        }

        .input-wrapper {
        position: relative;
        }

        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                var(--accent-orange),
                var(--accent-gold)
            );
            border: none;
            color: white;
            font-weight: 600;
            transition: 0.3s ease;
        }
    
        .btn-login:hover {
        transform: translateY(-2px);
        opacity: 0.95;
        color: white;
        }

        .forgot-link {
        color: var(--accent-orange);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        }

        .forgot-link:hover {
        color: var(--primary-blue);
        }

        @media (max-width: 576px) {
        .login-card {
            padding: 30px 22px;
        }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo-circle">
            <img src="images/logo.png" class="w-100" alt="">
        </div>

        <div class="text-center mb-4">
            <h2 class="login-title mb-2">Admin Login</h2>
            <p class="login-subtitle mb-0">
                Sign in to access the dashboard
            </p>
        </div>

        <form action="" method="">

            <!-- Email -->
            <div class="mb-3 input-wrapper">
                <span class="input-group-text">
                <i class="fas fa-envelope"></i>
                </span>

                <input
                type="email"
                class="form-control"
                placeholder="Email Address"
                required
                />
            </div>

            <!-- Password -->
            <div class="mb-3 input-wrapper">
                <span class="input-group-text">
                <i class="fas fa-lock"></i>
                </span>

                <input
                type="password"
                class="form-control"
                placeholder="Password"
                required
                />
            </div>

            <!-- Remember + Forgot -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                />
                <label class="form-check-label small" for="remember">
                    Remember me
                </label>
                </div>

                <a href="#" class="forgot-link">
                Forgot Password?
                </a>

            </div>

            <!-- Button -->
            <!-- remove "a" tag and un-commit button tag after backend integration -->
            <a href="admin_dashboard.html" class="btn btn-login w-100">
                <!-- <button type="submit" class="btn btn-login w-100"> -->
                    Login
                <!-- </button> -->
            </a>

        </form>

    </div>

</body>
</html>
