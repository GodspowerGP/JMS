<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0a2540;
            --secondary-color: #f97316;
            --success-color: #198754;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #0dcaf0;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .header {
            margin-bottom: 2rem;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid var(--primary-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .stat-card.success {
            border-left-color: var(--success-color);
        }

        .stat-card.warning {
            border-left-color: var(--warning-color);
        }

        .stat-card.danger {
            border-left-color: var(--danger-color);
        }

        .stat-card.info {
            border-left-color: var(--info-color);
        }

        .stat-card-label {
            color: #7f8c8d;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .form-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-section h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-section h2 i {
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control,
        .form-select,
        textarea {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .btn-custom {
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary-custom {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary-custom:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .btn-secondary-custom {
            background: #f0f0f0;
            color: #2c3e50;
        }

        .btn-secondary-custom:hover {
            background: #e0e0e0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--success-color);
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-custom {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-primary {
            background: rgba(13, 110, 253, 0.1);
            color: var(--primary-color);
        }

        .recent-blogs {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-top: 2rem;
        }

        .recent-blogs h3 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .blog-item {
            padding: 1rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .blog-item:last-child {
            border-bottom: none;
        }

        .blog-info h4 {
            color: #2c3e50;
            font-size: 0.95rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        .blog-info p {
            color: #7f8c8d;
            font-size: 0.85rem;
            margin: 0;
        }

        .blog-tag {
            background: rgba(13, 110, 253, 0.1);
            color: var(--primary-color);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stat-card-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-pen-fancy"></i>Admin Dashboard</h1>
            <p>Manage and publish your blog content</p>
        </div>

        <!-- Dashboard Stats -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-card-label">
                    <i class="fas fa-file-alt"></i> Total Posts
                </div>
                <div class="stat-card-value" id="total-posts">0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-card-label">
                    <i class="fas fa-check-circle"></i> Published
                </div>
                <div class="stat-card-value" id="published-posts">0</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-card-label">
                    <i class="fas fa-clock"></i> Drafts
                </div>
                <div class="stat-card-value" id="draft-posts">0</div>
            </div>
            <div class="stat-card info">
                <div class="stat-card-label">
                    <i class="fas fa-tag"></i> Total Tags
                </div>
                <div class="stat-card-value" id="total-tags">0</div>
            </div>
        </div>

        <!-- Blog Form Section -->
        <div class="form-section">
            <h2><i class="fas fa-plus-circle"></i> Add New Blog Post</h2>
            
            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i> Blog post added successfully!
            </div>

            <form id="blog-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="blog-title">Blog Title *</label>
                        <input type="text" class="form-control" id="blog-title" placeholder="Enter blog title" required>
                    </div>
                    <div class="form-group">
                        <label for="blog-tag">Tag *</label>
                        <input type="text" class="form-control" id="blog-tag" placeholder="e.g., Technology, Business">
                    </div>
                </div>

                <div class="form-group">
                    <label for="blog-body">Blog Body *</label>
                    <textarea class="form-control" id="blog-body" placeholder="Write your blog content here..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="formFile" class="form-label">Upload Picture *</label>
                        <input class="form-control" type="file" id="formFile" required accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="blog-author">Author Name *</label>
                        <input type="text" class="form-control" id="blog-author" required placeholder="Your name">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn-custom btn-primary-custom">
                        <i class="fas fa-save"></i> Publish Post
                    </button>
                    <button type="reset" class="btn-custom btn-secondary-custom">
                        <i class="fas fa-redo"></i> Clear Form
                    </button>
                </div>
            </form>
        </div>

        <!-- Recent Blogs -->
        <div class="recent-blogs">
            <h3><i class="fas fa-history"></i> Recent Posts</h3>
            <div id="recent-blogs-list">
                <p style="color: #7f8c8d; text-align: center; padding: 2rem;">No posts yet. Create your first blog post!</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
